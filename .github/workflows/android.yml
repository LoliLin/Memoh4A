name: Android

# Manual builds can skip unit tests with the run_tests input.

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master, 'feat/**']
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run unit tests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # Release signing is optional: app/build.gradle.kts falls back to the
      # debug key when local.properties has no storeFile, so a missing secret
      # must not fail the build.
      # Secrets are passed through env and checked by the shell; the secrets
      # context cannot be used directly in a step's if expression.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release signing key configured; using the debug signing fallback."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat >> local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          ./gradlew -p build-logic test --no-daemon --stacktrace
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify remote-only APKs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          forbidden = {
              "libagora_llama.so", "libagora_proot.so", "libproot_exec.so",
              "libproot_loader.so", "libtalloc.so", "libllama.so",
          }
          apks = list(Path("app/build/outputs/apk").rglob("*.apk"))
          assert apks, "No APKs produced"
          for apk in apks:
              with ZipFile(apk) as archive:
                  unexpected = [name for name in archive.namelist()
                                if name.startswith("lib/") and Path(name).name in forbidden]
              assert not unexpected, f"{apk}: unexpected local runtime: {unexpected}"
          PY

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: memoh-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            build-logic/build/reports/tests/
            build-logic/build/test-results/
          if-no-files-found: warn
          retention-days: 14
