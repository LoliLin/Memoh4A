<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html,body,#terminal { width:100%; height:100%; margin:0; overflow:hidden; background:#0e1214; }
    body { touch-action:pan-y; -webkit-text-size-adjust:100%; }
    #terminal { box-sizing:border-box; padding:10px 8px 8px; }
    .xterm { height:100%; }
    .xterm-viewport { overscroll-behavior:contain; scrollbar-width:thin; }
    .xterm-helper-textarea { opacity:0 !important; }
  </style>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
</head>
<body>
  <div id="terminal" aria-label="Interactive workspace terminal"></div>
  <script>
    (() => {
      const terminal = new Terminal({
        allowProposedApi: false,
        convertEol: false,
        cursorBlink: true,
        cursorStyle: 'bar',
        fontFamily: '"Cascadia Mono", "Roboto Mono", monospace',
        fontSize: 13,
        lineHeight: 1.18,
        scrollback: 10000,
        theme: {
          background: '#0e1214',
          foreground: '#d9e4dd',
          cursor: '#b4d7c3',
          cursorAccent: '#0e1214',
          selectionBackground: '#40624f88',
          black: '#101719', red: '#e87979', green: '#a6d189', yellow: '#e5c890',
          blue: '#82aaff', magenta: '#c792ea', cyan: '#89ddff', white: '#d9e4dd',
          brightBlack: '#62706a', brightRed: '#f07178', brightGreen: '#c3e88d',
          brightYellow: '#ffcb6b', brightBlue: '#82aaff', brightMagenta: '#c792ea',
          brightCyan: '#89ddff', brightWhite: '#ffffff'
        }
      });
      const fit = new FitAddon.FitAddon();
      terminal.loadAddon(fit);
      terminal.open(document.getElementById('terminal'));

      let controlModifier = false;
      terminal.onData(data => AndroidTerminal.sendInputBase64(toBase64(data)));
      terminal.onResize(size => AndroidTerminal.resize(size.cols, size.rows));
      terminal.attachCustomKeyEventHandler(event => {
        if (event.type !== 'keydown' || !controlModifier || event.altKey || event.metaKey || event.ctrlKey) return true;
        const key = event.key.length === 1 ? event.key.toUpperCase() : '';
        let code = 0;
        if (key >= 'A' && key <= 'Z') code = key.charCodeAt(0) & 0x1f;
        else if (key === ' ' || key === '@') code = 0;
        else if (key === '[') code = 27;
        else if (key === '\\') code = 28;
        else if (key === ']') code = 29;
        else if (key === '^') code = 30;
        else if (key === '_') code = 31;
        else return true;
        controlModifier = false;
        terminal.input(String.fromCharCode(code), true);
        AndroidTerminal.controlModifierConsumed();
        return false;
      });

      function toBase64(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = '';
        for (let i = 0; i < bytes.length; i += 0x8000) {
          binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
        }
        return btoa(binary);
      }
      function fitAndReport() {
        try { fit.fit(); } catch (_) { return; }
      }
      window.fitTerminal = fitAndReport;
      window.focusTerminal = () => terminal.focus();
      window.setControlModifier = enabled => { controlModifier = !!enabled; };
      window.writeTerminalText = text => terminal.write(text);
      window.writeTerminalBase64 = base64 => {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        terminal.write(bytes);
      };
      window.sendTerminalKey = name => {
        const cursorPrefix = terminal.modes.applicationCursorKeysMode ? '\u001bO' : '\u001b[';
        const keys = {
          Esc: '\u001b', Tab: '\t',
          Left: cursorPrefix + 'D', Down: cursorPrefix + 'B',
          Up: cursorPrefix + 'A', Right: cursorPrefix + 'C',
          Home: '\u001b[H', End: '\u001b[F',
          'Page up': '\u001b[5~', 'Page down': '\u001b[6~', Delete: '\u001b[3~',
          F1: '\u001bOP', F2: '\u001bOQ', F3: '\u001bOR', F4: '\u001bOS',
          F5: '\u001b[15~', F6: '\u001b[17~', F7: '\u001b[18~', F8: '\u001b[19~',
          F9: '\u001b[20~', F10: '\u001b[21~', F11: '\u001b[23~', F12: '\u001b[24~'
        };
        if (Object.prototype.hasOwnProperty.call(keys, name)) terminal.input(keys[name], true);
        else if (name.length === 1) terminal.input(name, true);
        terminal.focus();
      };

      const observer = new ResizeObserver(fitAndReport);
      observer.observe(document.getElementById('terminal'));
      requestAnimationFrame(() => { fitAndReport(); AndroidTerminal.ready(); });
    })();
  </script>
</body>
</html>
